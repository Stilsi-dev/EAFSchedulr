<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/schedulr-logo.svg" />
    <meta name="description" content="Frontend development entrypoint for the EAF Schedulr redesign.">
    <title>EAF Schedulr — EAF to Google Calendar</title>

    <!--
      Theme bootstrap. Must stay inline, synchronous, and ahead of the
      stylesheet.

      The theme lives in a React `useEffect`, which cannot run until the whole
      bundle has downloaded, parsed and mounted. Until then `<html>` has no
      `.dark` class, so a student on a dark machine was served the light ground
      for the entire boot - measured at ~1.6s on a throttled phone - and then
      watched it flip. Resolving it here settles the question before the first
      pixel.

      Same three states as theme.ts: a stored `light` or `dark` is an explicit
      choice and wins outright, and anything else means no choice was ever made
      and the operating system decides. Kept deliberately tiny and
      dependency-free, because it blocks the parser and every byte is on the
      critical path. The key and its values must match theme.ts.
    -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('themePreference');
        } catch (e) {
          /* Private mode or blocked storage: the OS is the only preference. */
        }
        var dark =
          saved === 'light' || saved === 'dark'
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      #root {
        height: 100%;
      }

      /* The ground, painted before the stylesheet arrives so the very first
         frame is already the right theme. Mirrors `--background` in theme.css;
         the app's gradient paints over it with nothing to flash through. */
      html {
        background: #ffffff;
      }

      html.dark {
        background: oklch(0.16 0.015 255);
      }

      /* Native form controls, scrollbars and the date picker follow the theme
         instead of rendering light-on-dark. */
      html {
        color-scheme: light;
      }

      html.dark {
        color-scheme: dark;
      }
    </style>

    <!--
      Google Analytics, on unless refused, and off the critical path.

      The default is on. `gtag.js` loads for a student who has not answered the
      consent bar, and only a stored 'denied' stops it, so the student who
      ignores the bar - most of them, in a product used once a term - is
      measured. This is a deliberate product decision, and it is worth naming
      what it costs: the bar in ConsentBanner.tsx still asks "Can we count this
      visit?" while the answer is already yes, so it is a notice wearing a
      question's clothes. It is kept as an ask because the decline it offers is
      real and immediate, not because the wording is honest about the default.

      That immediacy is now load-bearing rather than a nicety. Under opt-in, a
      student who never answered had sent nothing; under opt-out they have, so
      `disable()` below is the only thing standing between a decline and a
      visit that was already counted. It has to bite in this session, because
      there is no next one.

      Two entry points, both called from analytics.ts:

        __eafAnalytics.enable()    the student accepted
        __eafAnalytics.disable()   the student changed their mind

      `disable()` has to bite mid-session. A student who accepts, uses the app,
      then switches analytics off in the Privacy Notice would otherwise keep
      being measured for the rest of their only visit - there is no next visit
      for a stored preference to take effect on. So it sets Google's documented
      `ga-disable-<id>` kill switch, which gtag.js consults at send time, and
      clears the cookies, rather than only writing to localStorage.

      Timing applies to the unanswered first visit as well as to consent
      already stored from a previous one, since both now load.
      Loading gtag.js from `<head>` cost a measured 1072ms of First Contentful
      Paint and every millisecond of Total Blocking Time (261ms) on a throttled
      phone: it competes with the app bundle for both the connection and the
      main thread, and the student is looking at nothing at all while it wins.
      The delay is a floor, not a guess - `load` alone fires while React is
      still mounting, so idle time exists but the app has not settled into it,
      and scheduling there just moved gtag.js's ~250ms of parsing from before
      first paint to on top of it. Waiting past the point where the student can
      act, then asking for idle, keeps it out of both.

      A fresh `enable()` skips all of it and loads at once. The student has
      just read the bar and clicked it, so the page settled long ago, there is
      no first paint left to protect, and an idle callback could only lose the
      visit if they close the tab inside its window.

      The key and its values must match the `analyticsConsent` reads and writes
      in analytics.ts. Unlike `darkMode` it is stored as a bare string rather
      than JSON, because it has three states and not two: a missing key means
      unasked. Only the React side still needs to tell unasked from 'granted' -
      it decides whether to show the bar - while this loader now cares about
      exactly one value, 'denied'.
    -->
    <script>
      (function () {
        var GA_ID = 'G-LEEDEK781L';
        var loaded = false;

        function loadGtag() {
          if (loaded) return;
          loaded = true;

          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { dataLayer.push(arguments); };
          gtag('js', new Date());
          gtag('config', GA_ID);

          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(s);
        }

        function scheduleAfterBoot() {
          setTimeout(function () {
            if ('requestIdleCallback' in window) {
              // The timeout is the backstop: on a page the student never
              // stops touching, idle may not arrive on its own.
              requestIdleCallback(loadGtag, { timeout: 5000 });
            } else {
              loadGtag();
            }
          }, 2000);
        }

        /* GA writes to the broadest domain it can reach, which is not always
           the host serving the page, so expiring the exact hostname alone can
           leave the cookie standing. */
        function clearCookie(name) {
          var parts = location.hostname.split('.');
          var stale = '=; expires=Thu, 01 Jan 1970 00:00:01 GMT; path=/';

          document.cookie = name + stale;
          for (var i = 0; i < parts.length - 1; i++) {
            document.cookie = name + stale + '; domain=.' + parts.slice(i).join('.');
          }
        }

        window.__eafAnalytics = {
          enable: function () {
            /* Cleared as well as set, so accept-then-decline-then-accept in one
               sitting does not leave a silenced tag looking like a live one. */
            window['ga-disable-' + GA_ID] = false;
            loadGtag();
          },
          disable: function () {
            window['ga-disable-' + GA_ID] = true;
            /* GA4's session cookie is the measurement id without its `G-`. */
            clearCookie('_ga');
            clearCookie('_ga_' + GA_ID.slice(2));
          }
        };

        var stored = null;
        try {
          stored = localStorage.getItem('analyticsConsent');
        } catch (e) {
          /* Private mode or blocked storage. Nothing can be remembered, so no
             refusal can be read back either - and with the default on, an
             unreadable store means load. A student in this state who declines
             is switched off for the session by disable() and has to decline
             again next time, because there is nowhere to write the answer. */
        }

        /* One value matters here. 'granted' and a missing key both load; only
           an explicit refusal does not. */
        if (stored !== 'denied') {
          if (document.readyState === 'complete') {
            scheduleAfterBoot();
          } else {
            addEventListener('load', scheduleAfterBoot, { once: true });
          }
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
